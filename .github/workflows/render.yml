name: render

on:
  workflow_dispatch:
    inputs:
      project:
        description: "컴포지션 폴더 (레포 루트 기준, 예: spike)"
        required: true
      quality:
        description: "draft | looks | delivery"
        required: false
        default: delivery

env:
  HYPERFRAMES_NO_TELEMETRY: "1"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install pinned HyperFrames
        run: npm ci

      - name: Check local assets exist (case-sensitive)
        run: node scripts/check-fonts.mjs "${{ inputs.project }}"

      - name: Drop media files missing from the repo (audio is never committed)
        run: node scripts/drop-missing-media.mjs "${{ inputs.project }}"

      - name: Ensure headless Chrome
        working-directory: ${{ inputs.project }}
        run: |
          "$GITHUB_WORKSPACE/node_modules/.bin/hyperframes" browser ensure

      - name: Render (SDR fixed, HDR layered composite breaks mix-blend-mode)
        working-directory: ${{ inputs.project }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$GITHUB_WORKSPACE/node_modules/.bin/hyperframes" render --sdr --quality "${{ inputs.quality }}" --output "$GITHUB_WORKSPACE/out/out.mp4"

      - name: Check duration matches the composition
        working-directory: ${{ inputs.project }}
        run: |
          expected=$(grep -o 'data-composition-id="[^"]*"[^>]*data-duration="[0-9.]*"' index.html | head -1 | grep -o 'data-duration="[0-9.]*"' | grep -o '[0-9.]*')
          actual=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$GITHUB_WORKSPACE/out/out.mp4")
          echo "expected=$expected actual=$actual"
          awk -v e="$expected" -v a="$actual" 'BEGIN { d = a - e; if (d < 0) d = -d; exit !(d <= 0.1) }'

      - name: QC sheet and freeze/black measurement (G1, G2 on the rendered MP4)
        run: |
          d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/out.mp4)
          rows=$(awk -v d="$d" 'BEGIN { r = int((d * 2 + 9) / 10); print (r < 1 ? 1 : r) }')
          ffmpeg -hide_banner -loglevel error -i out/out.mp4 -vf "fps=2,scale=384:-1,drawtext=text='%{pts\:hms}':x=6:y=6:fontsize=20:fontcolor=white:box=1:boxcolor=black@0.6,tile=10x${rows}" -frames:v 1 out/sheet.jpg
          ffmpeg -hide_banner -nostats -i out/out.mp4 -an -vf "freezedetect=n=0.003:d=2,blackdetect=d=0.1:pix_th=0.05" -f null - 2> out/qc.log || true
          grep -E "freeze_(start|end)|black_start" out/qc.log > out/qc.txt || echo "freeze/black 없음" > out/qc.txt
          cat out/qc.txt

      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ github.run_id }}
          path: |
            out/out.mp4
            out/sheet.jpg
            out/qc.txt
          retention-days: 14
