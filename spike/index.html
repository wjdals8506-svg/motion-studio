<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'Pretendard';
        font-weight: 400;
        src: url('assets/fonts/pretendard/Pretendard-Regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Pretendard';
        font-weight: 700;
        src: url('assets/fonts/pretendard/Pretendard-Bold.woff2') format('woff2');
      }
      :root {
        --ground: #0e0f13;
        --ink: #f4f1ea;
        --muted: #9a968c;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root { width: 100%; height: 100%; }
      #scene {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
        font-family: 'Pretendard', sans-serif;
        word-break: keep-all;
      }
      #title {
        color: var(--ink);
        font-size: 108px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      #sub {
        display: flex;
        gap: 0.4em;
        color: var(--muted);
        font-size: 40px;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-z7xn" id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section data-hf-id="hf-hk2r" id="scene" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <h1 data-hf-id="hf-lvq2" id="title">사람의 손이 닿은 디테일</h1>
        <p data-hf-id="hf-wejy" id="sub"><span data-hf-id="hf-8ozd">2026년</span><span data-hf-id="hf-a20s">10월</span><span data-hf-id="hf-1bmq">·</span><span data-hf-id="hf-j4xb">HyperFrames</span><span data-hf-id="hf-i075">v0.8</span></p>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#title', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.2);
      tl.fromTo('#sub span', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out', stagger: 0.1 }, 0.6);
      tl.to('#title, #sub', { opacity: 0, y: -24, duration: 0.35, ease: 'power2.in' }, 4.2);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
