<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Pretendard'; font-weight: 400; src: url('assets/fonts/pretendard/Pretendard-Regular.woff2') format('woff2'); }
      @font-face { font-family: 'Pretendard'; font-weight: 600; src: url('assets/fonts/pretendard/Pretendard-SemiBold.woff2') format('woff2'); }
      :root { --ground: #16161a; --box: #5c5c63; --ink: #ecebe6; --muted: #8a8a90; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; font-family: 'Pretendard', sans-serif; word-break: keep-all; }
      .beat { width: 100%; height: 100%; position: absolute; inset: 0; }
      .box { position: absolute; border: 2px dashed var(--box); }
      .box-label { position: absolute; transform: translateY(-100%); padding-bottom: 4px; white-space: nowrap; color: var(--muted); font-size: 28px; }
      .copy { position: absolute; left: 10%; right: 10%; top: 50%; transform: translateY(-50%); text-align: center; color: var(--ink); font-size: 76px; font-weight: 600; line-height: 1.3; }
      .caption { position: absolute; left: 0; right: 0; bottom: 43px; text-align: center; color: var(--muted); font-size: 28px; }
      .cue { position: absolute; top: 0; left: 0; width: 12px; height: 100%; background: var(--ink); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <section class="clip beat" id="beat-1" data-start="0" data-duration="3.045">
        
        <p class="copy" id="copy-1">서늘한<br>바람처럼</p>
        
        <p class="caption">#1 hook</p>
      </section>
      <section class="clip beat" id="beat-2" data-start="3.045" data-duration="4.5">
        
        
        
        <p class="caption">#2 hook</p>
      </section>
      <section class="clip beat" id="beat-3" data-start="7.545" data-duration="6">
        
        <p class="copy" id="copy-3">스며드는</p>
        
        <p class="caption">#3 proof</p>
      </section>
      <section class="clip beat" id="beat-4" data-start="13.545" data-duration="6">
        
        <p class="copy" id="copy-4">윤종신의<br>목소리와<br>이야기</p>
        <div class="cue" id="cue-1"></div>
        <p class="caption">#4 turn</p>
      </section>
      <section class="clip beat" id="beat-5" data-start="19.545" data-duration="4.5">
        
        <p class="copy" id="copy-5">2026 윤종신 전국투어 콘서트</p>
        
        <p class="caption">#5 proof</p>
      </section>
      <section class="clip beat" id="beat-6" data-start="24.045" data-duration="5.955">
        
        <p class="copy" id="copy-6">가을냄새<br>10. 2 서울에서 시작, 11월까지<br>서울 · 인천 · 수원 · 고양 · 부산 · 경주 · 대전</p>
        <div class="cue" id="cue-2"></div>
        <p class="caption">#6 cta</p>
      </section>
      <audio id="bgm" src="assets/audio/bgm.mp3" data-start="0" data-duration="30" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#copy-1', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.1);
      tl.fromTo('#copy-3', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 7.645);
      tl.fromTo('#copy-4', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 13.645);
      tl.fromTo('#copy-5', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 19.645000000000003);
      tl.fromTo('#copy-6', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 24.145000000000003);
      tl.fromTo('#cue-1', { x: -40, opacity: 1 }, { x: 1960, opacity: 1, duration: 0.6, ease: 'power2.inOut', immediateRender: false }, 18.045);
      tl.set('#cue-1', { opacity: 0 }, 18.645);
      tl.fromTo('#cue-2', { x: -40, opacity: 1 }, { x: 1960, opacity: 1, duration: 0.6, ease: 'power2.inOut', immediateRender: false }, 24.045);
      tl.set('#cue-2', { opacity: 0 }, 24.645);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
