<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/js/fog-glass.js"></script>
    <style>
      @font-face { font-family: 'Pretendard'; font-weight: 700; src: url('assets/fonts/pretendard/Pretendard-Bold.woff2') format('woff2'); }
      @font-face { font-family: 'Pretendard'; font-weight: 400; src: url('assets/fonts/pretendard/Pretendard-Regular.woff2') format('woff2'); }
      @font-face { font-family: 'Pretendard'; font-weight: 600; src: url('assets/fonts/pretendard/Pretendard-SemiBold.woff2') format('woff2'); }
      :root {
        --color-ground: #2b2738;
        --color-ink: #f6efe4;
        --color-muted: #d8cbbb;
        --color-accent: #ffc482;
        --font-sans: 'Pretendard', sans-serif;
        --type-headline-size: 140px;
        --type-headline-weight: 600;
        --type-headline-line: 1;
        --type-headline-tracking: -0.02em;
        --type-headline-family: var(--font-sans);
        --type-sub-size: 49px;
        --type-sub-weight: 400;
        --type-sub-line: 1.3;
        --type-sub-tracking: -0.01em;
        --type-sub-family: var(--font-sans);
        --type-line-size: 65px;
        --type-line-weight: 400;
        --type-line-line: 1.25;
        --type-line-tracking: -0.01em;
        --type-line-family: var(--font-sans);
        --type-cities-size: 43px;
        --type-cities-weight: 400;
        --type-cities-line: 1.2;
        --type-cities-tracking: 0em;
        --type-cities-family: var(--font-sans);
        --type-info-size: 38px;
        --type-info-weight: 400;
        --type-info-line: 1.4;
        --type-info-tracking: 0em;
        --type-info-family: var(--font-sans);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground); }
      #root { width: 100%; height: 100%; position: relative; word-break: keep-all; }
      .clip { position: absolute; inset: 0; }
      #cv { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .w { position: absolute; white-space: nowrap; font-family: var(--type-headline-family); color: var(--color-ink); text-shadow: 0 2px 26px rgba(20, 14, 10, 0.55); visibility: hidden; will-change: transform; }
      .big { font-size: var(--type-headline-size); font-weight: var(--type-headline-weight); letter-spacing: var(--type-headline-tracking); line-height: 1; }
      .mid { font-size: calc(var(--type-headline-size) * 0.8); font-weight: var(--type-headline-weight); letter-spacing: var(--type-headline-tracking); line-height: 1; }
      .small { font-size: var(--type-line-size); font-weight: var(--type-line-weight); color: var(--color-muted); line-height: 1; }
      /* 다시 등장한 키메시지 한 문장: 두 줄 모두 같은 글꼴·굵기·크기 */
      #final { position: absolute; inset: 0; font-family: var(--type-headline-family); }
      #final .ln { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; font-size: calc(var(--type-headline-size) * 0.72); font-weight: var(--type-headline-weight); letter-spacing: var(--type-headline-tracking); line-height: 1; color: var(--color-ink); text-shadow: 0 2px 26px rgba(20, 14, 10, 0.55); }
      #final .l1 { top: 38%; }
      #final .l2 { top: 50%; }
      #final .fw { display: inline-block; visibility: hidden; }
      #final .l1 { visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <!-- 컷 4 카피: 윤종신의 / 목소리와 / 이야기 -->
      <section class="clip" id="beat-4" data-start="0" data-duration="6" data-copy="윤종신의
목소리와
이야기">
        <canvas id="cv" width="1920" height="1080"></canvas>
        <div id="final"><p class="ln l1" id="f1">서늘한 바람처럼 스며드는</p><p class="ln l2"><span class="fw" id="f2">윤종신의</span> <span class="fw" id="f3">목소리와</span> <span class="fw" id="f4">이야기</span></p></div>
        <span class="w big" id="k2" style="left: 30%; top: 46%">윤종신의</span>
        <span class="w mid" id="k3" style="left: 70%; top: 58%">목소리와</span>
        <span class="w big" id="k4" style="left: 48%; top: 72%">이야기</span>
      </section>
      <audio id="bgm" src="assets/audio/bgm.mp3" data-start="0" data-duration="6" data-media-start="13.545" data-volume="1"></audio>
    </div>
    <script>
      // 키 모션 시각(이 키 컷의 지역 시각, 초). 영상 전체 시각 = 지역 시각 + 13.545
      window.__cues = [4.5];
      // 키 컷(2단계 2차): 박에 맞춰 단어가 위치·크기를 바꿔 착지하고, 정점(18.045초 = 지역 4.5초)에 키메시지 한 문장으로 모인다.
      // 창은 대부분 맑고 가장자리에만 김(물방울·닦기 효과 없음, 사용자 결정). 시각은 3단계 박자 지도에서 온다.
      const OFFSET = 13.545, BEAT = { w2: 15.02 - OFFSET, w3: 16.52 - OFFSET, w4: 17.27 - OFFSET, hero: __cues[0] };
      const clamp01 = x => Math.min(1, Math.max(0, x));
      const fg = FogGlass.create(document.getElementById('cv'), { seed: 7 });
      function renderAt(t) {
        fg.render({
          t: t + OFFSET, lightsOn: 1, clear: 1, refog: 0.3,                 // 맑은 창, 가장자리만 김
          cam: { x: 0.004 * t, y: 0, zoom: 1 + 0.045 * Math.pow(clamp01((t - 4.9) / 1.1), 2) },
        });
      }
      window.addEventListener('hf-seek', e => renderAt(e.detail.time));
      renderAt(0);

      const tl = gsap.timeline({ paused: true });
      gsap.set('.w', { xPercent: -50, yPercent: -50 });
      // 순차 등장: 세 단어가 박에 맞춰 서로 다른 자리에 천천히 내려앉는다(0.9초 전 출발, power2.out)
      [['#k2', BEAT.w2, { x: -180 }], ['#k3', BEAT.w3, { y: 60 }], ['#k4', BEAT.w4, { y: -40, scale: 1.12 }]].forEach(([id, at, from]) => {
        tl.set(id, { visibility: 'visible' }, at - 0.9);
        tl.fromTo(id, { ...from, filter: 'blur(4px)' }, { x: 0, y: 0, scale: 1, filter: 'blur(0px)', duration: 0.9, ease: 'power2.out' }, at - 0.9);
      });
      // 다시 모임: 정점(18.045초)에 세 단어가 "윤종신의 목소리와 이야기" 한 덩이로 움직여 모이고,
      // 그 위에 "서늘한 바람처럼 스며드는" 한 덩이가 같은 글꼴로 나타난다. 자리는 글꼴 로드 뒤에 잰다
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.sentence = document.fonts.load("600 140px 'Pretendard'").then(() => {
        ['k2', 'k3', 'k4'].forEach((id, i) => {
          const k = document.getElementById(id), f = document.getElementById('f' + (i + 2)), b = f.getBoundingClientRect();
          const ax = parseFloat(k.style.left) / 100 * 1920, ay = parseFloat(k.style.top) / 100 * 1080;   // 원래 자리(가운데 기준)
          const sc = parseFloat(getComputedStyle(f).fontSize) / parseFloat(getComputedStyle(k).fontSize);
          tl.to(k, { x: b.left + b.width / 2 - ax, y: b.top + b.height / 2 - ay, scale: sc, duration: 1.2, ease: 'power2.inOut' }, BEAT.hero - 0.45 + 0.06 * i);   // 정점 0.45초 전부터 모여 정점을 지나며 자리
        });
        tl.set('#f1', { visibility: 'visible' }, BEAT.hero + 0.25);           // 세 단어가 아래 줄로 거의 모인 뒤 위 덩이가 나타난다(겹침 방지)
        tl.fromTo('#f1', { y: 26, filter: 'blur(6px)' }, { y: 0, filter: 'blur(0px)', duration: 1.1, ease: 'power2.out' }, BEAT.hero + 0.25);
        window.__timelines['main'] = tl;                                    // 트윈을 다 넣은 뒤 등록(엔진 규칙)
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
        tl.seek(0);
      });
    </script>
  </body>
</html>
