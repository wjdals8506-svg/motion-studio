<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'GowunBatang'; font-weight: 700; src: url('assets/fonts/gowunbatang/GowunBatang-Bold.ttf'); }
      @font-face { font-family: 'GowunBatang'; font-weight: 400; src: url('assets/fonts/gowunbatang/GowunBatang-Regular.ttf'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; position: relative; word-break: keep-all; font-family: 'GowunBatang', serif; color: #f4ece0; }
      /* 4단계 키 컷 tone-a: 3단계 승인 애니매틱 + 후보 A 톤 맞춤(사용자 선택 2026-11-01). 곡 bgm-3(음원은 커밋하지 않음, 원격은 무음 렌더 후 PC에서 붙임) */
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      /* 글자 받침: 글자가 놓이는 쪽만 어둡게(밝은 배경 위 글자는 막·그림자로, 사용자 지시) */
      .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 55%; background: linear-gradient(to top, rgba(10,7,4,0.82), rgba(10,7,4,0)); visibility: hidden; }
      .line { position: absolute; left: 192px; top: 760px; font-weight: 400; font-size: 72px; letter-spacing: -0.01em; white-space: nowrap; visibility: hidden; text-shadow: 0 2px 24px rgba(0,0,0,0.55), 0 1px 4px rgba(0,0,0,0.6); }
      /* 끝 제목·정보: 화면 상하 가운데에 한 덩어리로(사용자 지시 2026-11-01) */
      #endblock { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .end { text-align: center; white-space: nowrap; visibility: hidden; text-shadow: 0 2px 24px rgba(0,0,0,0.5); }
      /* A 톤 맞춤: 컷마다 다른 색을 같은 따뜻한 호박빛 중간톤으로(효과 추가 없음) */
      #v1 { filter: brightness(0.9) saturate(0.75) sepia(0.18); }
      #v2 { filter: brightness(0.62) saturate(0.8) sepia(0.25) contrast(1.1); }
      #v3, #v5 { filter: brightness(0.8) saturate(0.9) sepia(0.1); }
      #v4 { filter: brightness(0.5) saturate(0.85) sepia(0.3) contrast(1.2); }
      #v6 { transform: scale(1.04); transform-origin: 30% 90%; filter: saturate(0.9) sepia(0.08); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <video id="v1" class="clip shot" src="assets/video/needle-11999586.mp4" muted playsinline data-start="0" data-duration="4.545" data-media-start="0.3"></video>
      <video id="v2" class="clip shot" src="assets/video/grass-33536359.mp4" muted playsinline data-start="4.545" data-duration="1.5" data-media-start="2"></video>
      <video id="v3" class="clip shot" src="assets/video/branches-6677775.mp4" muted playsinline data-start="6.045" data-duration="3" data-media-start="2"></video>
      <video id="v4" class="clip shot" src="assets/video/stylus-4306406.mp4" muted playsinline data-start="9.045" data-duration="3" data-media-start="2"></video>
      <video id="v5" class="clip shot" src="assets/video/branches-6677775.mp4" muted playsinline data-start="12.045" data-duration="3" data-media-start="13"></video>
      <video id="v6" class="clip shot" src="assets/video/spotlight-1534965.mp4" muted playsinline data-start="15.045" data-duration="4.5" data-media-start="2"></video>
      <video id="v8" class="clip shot" src="assets/video/turntable-3116506.mp4" muted playsinline data-start="19.545" data-duration="10.455" data-media-start="3"></video>
      <div class="shade" id="sh1" data-layout-allow-occlusion></div>
      <p class="line" id="l1">서늘한 바람처럼 스며드는</p>
      <p class="line" id="l2" style="left:auto;right:192px;top:820px">윤종신의 목소리와 이야기</p>
      <div id="endblock">
        <p class="end" id="t" style="font-size:128px;font-weight:700;line-height:1.2;margin-bottom:44px">가을냄새</p>
        <p class="end" id="i0" style="font-size:56px;font-weight:700;line-height:1.3;margin-bottom:20px">2026 윤종신 전국투어 콘서트</p>
        <p class="end" id="i1" style="font-size:52px;line-height:1.4;margin-bottom:8px">10월 2일 서울에서 시작, 11월까지</p>
        <p class="end" id="i2" style="font-size:50px;line-height:1.4">서울 · 인천 · 수원 · 고양 · 부산 · 경주 · 대전</p>
      </div>
      <audio id="bgm" src="assets/audio/bgm.mp3" data-start="0" data-duration="30" data-volume="0.55" data-fade-in="1.5" data-fade-out="2.5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.tonea = Promise.all(["700 100px 'GowunBatang'", "400 60px 'GowunBatang'"].map(f => document.fonts.load(f, '서늘한바람처럼스며드는윤종신의목소리와이야기가을냄새2026전국투어콘서트서울에서시작월일까지인천수원고양부산경주대전')))
        .then(() => {
          const tl = gsap.timeline({ paused: true });
          // 글자는 "말이 스며든다"는 뜻으로만 움직인다: 제자리에서 흐림이 천천히 걷힘(조용한 주제의 페이드 예외)
          const seep = (sel, at, dur = 1.4) => {
            tl.set(sel, { visibility: 'visible' }, at);
            tl.fromTo(sel, { opacity: 0, filter: 'blur(14px)' }, { opacity: 1, filter: 'blur(0px)', duration: dur, ease: 'power2.out' }, at);
          };
          // 글자는 끊기지 않고 이어 읽히게(사용자 지시 2026-11-01): 앞줄이 컷에서 사라지면 0.25초 뒤 다음 줄, 빈 화면은 1초 미만
          // 키메시지 앞 절반: 잎(6.045초)부터 바늘 클로즈업 끝(12.045초)까지, 왼쪽 아래
          tl.set('#sh1', { visibility: 'visible' }, 6.045);
          seep('#l1', 6.3);
          tl.set('#l1', { visibility: 'hidden' }, 12.045);
          // 키메시지 뒤 절반: 가지(12.045초)부터 무대 조명 끝(19.545초)까지, 오른쪽 아래(조명 반대편)
          seep('#l2', 12.3);
          tl.set('#sh1', { visibility: 'hidden' }, 15.045);
          tl.set('#l2', { visibility: 'hidden' }, 19.545);
          // 끝: 한 컷으로 이어진 턴테이블이 제목과 함께 끊김 없이 천천히 어두워짐(19.8초부터 29초까지, 마지막은 아주 어둡게)
          tl.set('#v8', { filter: 'brightness(0.62) saturate(0.95) sepia(0.6)' }, 19.545);
          tl.to('#v8', { filter: 'brightness(0.16) saturate(0.8) sepia(0.6)', duration: 9.2, ease: 'sine.inOut' }, 19.8);
          seep('#t', 19.8, 1.6);
          seep('#i0', 21.045, 1.0);
          seep('#i1', 21.6, 1.0);
          seep('#i2', 22.15, 1.0);
          tl.set({}, {}, 30);
          window.__timelines['main'] = tl;
          if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
          tl.seek(0);
        });
    </script>
  </body>
</html>
