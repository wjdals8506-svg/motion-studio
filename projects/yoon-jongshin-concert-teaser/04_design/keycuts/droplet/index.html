<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/js/fog-glass.js"></script>
    <style>
      @font-face { font-family: 'Pretendard'; font-weight: 700; src: url('assets/fonts/pretendard/Pretendard-Bold.woff2') format('woff2'); }
      @font-face { font-family: 'Pretendard'; font-weight: 400; src: url('assets/fonts/pretendard/Pretendard-Regular.woff2') format('woff2'); }
      @font-face { font-family: 'Pretendard'; font-weight: 600; src: url('assets/fonts/pretendard/Pretendard-SemiBold.woff2') format('woff2'); }
      :root {
        --color-ground: #2b2738;
        --color-ink: #f6efe4;
        --color-muted: #d8cbbb;
        --color-accent: #f0b072;
        --font-sans: 'Pretendard', sans-serif;
        --type-headline-size: 140px;
        --type-headline-weight: 600;
        --type-headline-line: 1;
        --type-headline-tracking: -0.02em;
        --type-headline-family: var(--font-sans);
        --type-sub-size: 49px;
        --type-sub-weight: 400;
        --type-sub-line: 1.3;
        --type-sub-tracking: -0.01em;
        --type-sub-family: var(--font-sans);
        --type-line-size: 65px;
        --type-line-weight: 400;
        --type-line-line: 1.25;
        --type-line-tracking: -0.01em;
        --type-line-family: var(--font-sans);
        --type-cities-size: 43px;
        --type-cities-weight: 400;
        --type-cities-line: 1.2;
        --type-cities-tracking: 0em;
        --type-cities-family: var(--font-sans);
        --type-info-size: 38px;
        --type-info-weight: 400;
        --type-info-line: 1.4;
        --type-info-tracking: 0em;
        --type-info-family: var(--font-sans);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground); }
      #root { width: 100%; height: 100%; position: relative; word-break: keep-all; }
      .clip { position: absolute; inset: 0; }
      #cv { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.045" data-width="1920" data-height="1080">
      <!-- 컷 1 카피: (없음) -->
      <section class="clip" id="beat-1" data-start="0" data-duration="3.045" data-copy="">
        <canvas id="cv" width="1920" height="1080"></canvas>
      </section>
      <audio id="bgm" src="assets/audio/bgm.mp3" data-start="0" data-duration="3.045" data-media-start="0" data-volume="1"></audio>
    </div>
    <script>
      // 키 모션 시각(이 키 컷의 지역 시각, 초). 영상 전체 시각 = 지역 시각 + 0
      window.__cues = [];
      // 키 컷: 김 서린 유리 클로즈업. 첫 음(1.52초)에 물방울이 흐르기 시작하고, 카메라가 물방울을 따라 내려가며 물러난다.
      // 끝 상태는 2단계 설계표의 연결(디자인): 물방울 화면 x0.55 y0.62, 크기 약 0.06H, 아래로 흐르는 중.
      const FIRST_NOTE = 1.52;                                            // 3단계 음악 측정: 첫 음 1.52초
      const clamp01 = x => Math.min(1, Math.max(0, x));
      const fg = FogGlass.create(document.getElementById('cv'), { seed: 7 });
      const DX = 0.55, Y0 = 0.62, R = 0.012;   // 유리 아래쪽: 뒤로 도시 불빛이 김 너머 번져 보이는 자리                               // 물방울(유리 위 좌표, 화면 높이 비율)
      function renderAt(t) {
        const run = clamp01((t - FIRST_NOTE) / (3.045 - FIRST_NOTE));
        const dy = Y0 + 0.012 * Math.sin(t * 2.1) * (1 - run) * 0.1 + 0.075 * Math.pow(run, 1.6);   // 맺혀 있다가 점점 빨리 흐른다
        const z = 3.4 - 0.9 * (1 - Math.pow(1 - clamp01(t / 3.045), 2));    // 3.4배 → 2.5배로 물러남(감속)
        const sx = 0.55, sy = 0.45 + 0.17 * Math.pow(run, 1.3);            // 화면 속 물방울 위치: 카메라가 뒤따라 내려간다
        fg.render({
          t,
          cam: { x: DX - 0.5 - (sx - 0.5) / z, y: dy - 0.5 - (sy - 0.5) / z, zoom: z },
          droplet: { x: DX, y: dy, y0: Y0, r: R, stretch: Math.pow(run, 0.8) },   // 빨라질수록 아래로 늘어난다
        });
      }
      window.addEventListener('hf-seek', e => renderAt(e.detail.time));
      renderAt(0);

      const tl = gsap.timeline({ paused: true });
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
