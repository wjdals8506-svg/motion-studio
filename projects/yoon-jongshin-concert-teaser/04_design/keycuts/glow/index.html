    <style>
      @font-face { font-family: 'GowunBatang'; font-weight: 700; src: url('assets/fonts/gowunbatang/GowunBatang-Bold.ttf'); }
      @font-face { font-family: 'GowunBatang'; font-weight: 400; src: url('assets/fonts/gowunbatang/GowunBatang-Regular.ttf'); }
      :root { --ink: #f6efe4; --muted: #d8cbbb; --font: 'GowunBatang', serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; position: relative; word-break: keep-all; }
      /* 글자 창: 영상 위에 검은 바탕·흰 글자 층을 곱하면 획 안에서만 영상이 보인다.
         그 위에 바탕색(screen)과 옅은 나뭇잎 그림자(screen)를 얹는다 */
      #stack { position: absolute; inset: 0; isolation: isolate; overflow: hidden; }
      #footage { position: absolute; inset: 0; }
      #footage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #mask { position: absolute; inset: 0; background: #000; mix-blend-mode: multiply; }
      #mask .w { position: absolute; color: #fff; font-family: var(--font); font-weight: 700; line-height: 1; white-space: nowrap; visibility: hidden; will-change: transform; }
      #tint { position: absolute; inset: 0; background: #12161d; mix-blend-mode: screen; }
      #shade { position: absolute; inset: 0; mix-blend-mode: screen; opacity: 0.09; }
      #shade video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.4); }
      /* 영상이 화면 전체일 때 글자 받침(5단계 2차 지시: 밝은 배경 위 글자는 막·그림자로) */
      #veil { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 50% at 50% 50%, rgba(20,14,10,0.55), rgba(20,14,10,0.12) 75%); opacity: 0; }
      .line { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--font); color: var(--ink); white-space: nowrap; text-shadow: 0 2px 28px rgba(20,14,10,0.7); }
      #msg { top: 45%; font-size: 100px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
      #msg span { display: inline-block; visibility: hidden; }
      #voice { position: absolute; left: 560px; top: 610px; width: 800px; height: 70px; opacity: 0; }
      .info { font-size: 40px; font-weight: 400; color: var(--muted); letter-spacing: 0.01em; visibility: hidden; text-shadow: none; }
      /* 보조 장치: 15초 전까지 위아래 검은 띠(2.39:1), "스며드는" 안으로 들어가며 열린다 */

      #barT { top: 0; transform-origin: top; } #barB { bottom: 0; transform-origin: bottom; }
      /* 4단계 스타일 B 번지는 빛(2026-11-01 선택): 영상 빛이 획 둘레로 번져 나옴, 커튼 호박빛 보정 */
      #wCurtain video { filter: sepia(0.45) saturate(1.35) hue-rotate(-10deg) brightness(0.92) contrast(1.08); }
      #mask .w { -webkit-text-stroke: 0.012em #fff; text-shadow: 0 0 30px rgba(255,255,255,0.75), 0 0 90px rgba(255,255,255,0.35); }
      #t6 { font-size: 360px !important; }
      #msg { text-shadow: 0 0 40px rgba(255,214,160,0.45), 0 2px 28px rgba(20,14,10,0.7); }

          tl.set('#t6', { visibility: 'visible', scale: 9 }, T.c6);
          tl.to('#t6', { scale: 1, duration: 1.5, ease: 'power3.out' }, T.c6);
          tl.to('#mask', { backgroundColor: '#000', duration: 0.5, ease: 'power2.out' }, T.c6 + 0.05);
          tl.to('#tint', { opacity: 1, duration: 0.6 }, T.c6 + 0.05);
          // 공연 정보: 박에 맞춰 차례로 착지, 이후 엔드 홀드
          ['#i1', '#i2', '#i3'].forEach((s, i) => {
            const at = T.info + 0.75 * i;
            tl.set(s, { visibility: 'visible' }, at - 0.6);
            tl.fromTo(s, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: 'power2.out' }, at - 0.6);
          });
          window.__timelines['main'] = tl;
          if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
          tl.seek(0);
        });
    </script>
  </body>
</html>
