<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/js/fog-glass.js"></script>
    <style>
      @font-face { font-family: 'Pretendard'; font-weight: 700; src: url('assets/fonts/pretendard/Pretendard-Bold.woff2') format('woff2'); }
      @font-face { font-family: 'Pretendard'; font-weight: 400; src: url('assets/fonts/pretendard/Pretendard-Regular.woff2') format('woff2'); }
      @font-face { font-family: 'Pretendard'; font-weight: 600; src: url('assets/fonts/pretendard/Pretendard-SemiBold.woff2') format('woff2'); }
      :root {
        --color-ground: #2b2738;
        --color-ink: #f6efe4;
        --color-muted: #d8cbbb;
        --color-accent: #f0b072;
        --font-sans: 'Pretendard', sans-serif;
        --type-headline-size: 140px;
        --type-headline-weight: 600;
        --type-headline-line: 1;
        --type-headline-tracking: -0.02em;
        --type-headline-family: var(--font-sans);
        --type-sub-size: 49px;
        --type-sub-weight: 400;
        --type-sub-line: 1.3;
        --type-sub-tracking: -0.01em;
        --type-sub-family: var(--font-sans);
        --type-line-size: 65px;
        --type-line-weight: 400;
        --type-line-line: 1.25;
        --type-line-tracking: -0.01em;
        --type-line-family: var(--font-sans);
        --type-cities-size: 43px;
        --type-cities-weight: 400;
        --type-cities-line: 1.2;
        --type-cities-tracking: 0em;
        --type-cities-family: var(--font-sans);
        --type-info-size: 38px;
        --type-info-weight: 400;
        --type-info-line: 1.4;
        --type-info-tracking: 0em;
        --type-info-family: var(--font-sans);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground); }
      #root { width: 100%; height: 100%; position: relative; word-break: keep-all; }
      .clip { position: absolute; inset: 0; }
      #cv { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .info { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--type-info-family); font-size: var(--type-info-size); font-weight: var(--type-info-weight); line-height: var(--type-info-line); color: var(--color-ground); visibility: hidden; }
      #i1 { top: 63%; }
      #i2 { top: 68%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.955" data-width="1920" data-height="1080">
      <!-- 컷 6 카피: 가을냄새 / 2026 윤종신 전국투어 콘서트 / 10. 2 서울에서 시작, 11월까지 -->
      <section class="clip" id="beat-6" data-start="0" data-duration="5.955" data-copy="가을냄새
2026 윤종신 전국투어 콘서트
10. 2 서울에서 시작, 11월까지">
        <canvas id="cv" width="1920" height="1080"></canvas>
        <p class="info" id="i1">2026 윤종신 전국투어 콘서트</p>
        <p class="info" id="i2">10. 2 서울에서 시작, 11월까지</p>
      </section>
      <audio id="bgm" src="assets/audio/bgm.mp3" data-start="0" data-duration="5.955" data-media-start="24.045" data-volume="1"></audio>
    </div>
    <script>
      // 키 모션 시각(이 키 컷의 지역 시각, 초). 영상 전체 시각 = 지역 시각 + 24.045
      window.__cues = [0];
      // 키 컷: 닦였던 유리에 김이 가장자리부터 다시 서리고, 그 김 위로 '가을냄새'가 글꼴 모양 그대로 왼쪽부터 닦여 드러난다
      // (24.045초 시작, 사용자 결정 2026-10-31: 손가락 글씨 대신 "이쁜 폰트 모양", 물줄기 없음).
      // 글자 모양 사이로 흐린 저녁 불빛이 보인다. 마지막 1.2초는 완전히 정지(엔드 홀드).
      const OFFSET = 24.045, HOLD = 4.755;
      const TITLE_FONT = "600 151px 'Pretendard'";                         // 0.14H, 헤드라인 굵기(korean-type.md)
      const clamp01 = x => Math.min(1, Math.max(0, x));
      const fg = FogGlass.create(document.getElementById('cv'), { seed: 7, sweep: { y: 0.5, r: 0.27 } });
      let glyph = null, lastT = 0;
      function renderAt(t) {
        lastT = t;
        const tt = Math.min(t, HOLD);                                     // 엔드 홀드: 화면은 HOLD 시각에 멈춘다
        const p = clamp01((tt - __cues[0] - 0.15) / 2.1);                 // 0.15 → 2.25초 동안 드러남(감속)
        fg.render({
          t: tt + OFFSET,
          cam: { x: 0.015, y: 0, zoom: 1 + 0.02 * clamp01(tt / HOLD) },
          trail: { progress: 1, y: 0.7, h: 0.12 },
          sweep: { progress: 1 },
          refog: 0.62 + 0.38 * (1 - Math.pow(1 - clamp01(tt / 0.7), 3)),  // 앞 컷에서 서리기 시작한 김이 0.7초에 다 덮인다
          title: { glyph, x: 0.5, y: 0.42, progress: 1 - Math.pow(1 - p, 2) },
        });
      }
      // 글꼴이 로드된 뒤 글리프를 만들고 다시 그린다. 렌더러는 이 준비가 끝날 때까지 기다린다
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.title = document.fonts.load(TITLE_FONT).then(() => {
        glyph = FogGlass.makeTitle('가을냄새', TITLE_FONT, -3);
        renderAt(lastT);
      });
      window.addEventListener('hf-seek', e => renderAt(e.detail.time));
      renderAt(0);

      const tl = gsap.timeline({ paused: true });
      // 공연 정보: 제목이 다 드러난 뒤 짧은 오프셋으로 한 줄씩 착지(페이드 인 없음), 4.755초부터 완전 정지
      tl.set('#i1', { visibility: 'visible', y: 14 }, 2.75);
      tl.to('#i1', { y: 0, duration: 0.45, ease: 'power3.out' }, 2.75);
      tl.set('#i2', { visibility: 'visible', y: 18 }, 3.05);
      tl.to('#i2', { y: 0, duration: 0.55, ease: 'expo.out' }, 3.05);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
