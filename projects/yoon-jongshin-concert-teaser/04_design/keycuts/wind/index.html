<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/js/fog-glass.js"></script>
    <style>
      @font-face { font-family: 'Pretendard'; font-weight: 700; src: url('assets/fonts/pretendard/Pretendard-Bold.woff2') format('woff2'); }
      @font-face { font-family: 'Pretendard'; font-weight: 400; src: url('assets/fonts/pretendard/Pretendard-Regular.woff2') format('woff2'); }
      @font-face { font-family: 'Pretendard'; font-weight: 600; src: url('assets/fonts/pretendard/Pretendard-SemiBold.woff2') format('woff2'); }
      :root {
        --color-ground: #2b2738;
        --color-ink: #f6efe4;
        --color-muted: #d8cbbb;
        --color-accent: #f0b072;
        --font-sans: 'Pretendard', sans-serif;
        --type-headline-size: 140px;
        --type-headline-weight: 600;
        --type-headline-line: 1;
        --type-headline-tracking: -0.02em;
        --type-headline-family: var(--font-sans);
        --type-sub-size: 49px;
        --type-sub-weight: 400;
        --type-sub-line: 1.3;
        --type-sub-tracking: -0.01em;
        --type-sub-family: var(--font-sans);
        --type-line-size: 65px;
        --type-line-weight: 400;
        --type-line-line: 1.25;
        --type-line-tracking: -0.01em;
        --type-line-family: var(--font-sans);
        --type-cities-size: 43px;
        --type-cities-weight: 400;
        --type-cities-line: 1.2;
        --type-cities-tracking: 0em;
        --type-cities-family: var(--font-sans);
        --type-info-size: 38px;
        --type-info-weight: 400;
        --type-info-line: 1.4;
        --type-info-tracking: 0em;
        --type-info-family: var(--font-sans);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground); }
      #root { width: 100%; height: 100%; position: relative; word-break: keep-all; }
      .clip { position: absolute; inset: 0; }
      #cv { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .copy { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--type-headline-family); }
      #c1 { top: 33%; font-size: var(--type-headline-size); font-weight: var(--type-headline-weight); line-height: var(--type-headline-line); letter-spacing: var(--type-headline-tracking); color: var(--color-ink); text-shadow: 0 2px 28px rgba(20, 14, 10, 0.55); }
      #c2 { top: 49%; font-size: var(--type-sub-size); font-weight: var(--type-sub-weight); letter-spacing: var(--type-sub-tracking); color: var(--color-muted); text-shadow: 0 1px 18px rgba(20, 14, 10, 0.6); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <!-- 컷 4 카피: 스며드는 / 윤종신의 목소리와 이야기 -->
      <section class="clip" id="beat-4" data-start="0" data-duration="6" data-copy="스며드는
윤종신의 목소리와 이야기">
        <canvas id="cv" width="1920" height="1080"></canvas>
        <p class="copy" id="c1">스며드는</p>
        <p class="copy" id="c2">윤종신의 목소리와 이야기</p>
      </section>
      <audio id="bgm" src="assets/audio/bgm.mp3" data-start="0" data-duration="6" data-media-start="13.545" data-volume="1"></audio>
    </div>
    <script>
      // 키 모션 시각(이 키 컷의 지역 시각, 초). 영상 전체 시각 = 지역 시각 + 13.545
      window.__cues = [1.5,4.5];
      // 키 컷: 큰 바람이 창을 쓸고(15.045초 시작) "스며드는"이 18.045초에 착지, 끝에서 카메라가 유리로 밀고 들어간다
      const OFFSET = 13.545;
      const clamp01 = x => Math.min(1, Math.max(0, x));
      const inOut = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const fg = FogGlass.create(document.getElementById('cv'), { seed: 7, sweep: { y: 0.5, r: 0.27 } });
      const c1 = document.getElementById('c1'), c2 = document.getElementById('c2');
      // 카피는 김 뒤에 있다가 바람이 닦아 낸 만큼만 드러나고(2단계 A안: 닦인 자리에 키메시지가 드러남),
      // 흐림이 걷히며 4.5초(18.045)에 또렷하게 자리 잡는다. 불투명도 페이드는 쓰지 않는다(never-ship).
      function revealCopy(t, p) {
        const front = (-0.06 + 1.12 * p + 0.11) * 100;               // 닦인 띠의 앞쪽 가장자리(화면 폭 %)
        const m = `linear-gradient(90deg, #000 ${front - 10}%, transparent ${front + 4}%)`;
        for (const el of [c1, c2]) { el.style.maskImage = m; el.style.webkitMaskImage = m; }
        // 닦인 띠가 글자 자리(화면 폭 약 33%)에 닿기 전에는 글자 자체가 없다
        for (const el of [c1, c2]) el.style.visibility = front + 4 < 33 ? 'hidden' : 'visible';
        const settle = clamp01((t - 3.6) / 0.9), e = 1 - Math.pow(1 - settle, 4);   // 3.6 → 4.5초 감속 착지
        c1.style.filter = `blur(${(10 * (1 - e)).toFixed(2)}px)`;
        c1.style.transform = `translateY(${(22 * (1 - e)).toFixed(1)}px)`;
        const s2 = clamp01((t - 3.9) / 1.0), e2 = 1 - Math.pow(1 - s2, 3);          // 보조 줄은 다른 꼬리로 0.4초 늦게
        c2.style.filter = `blur(${(8 * (1 - e2)).toFixed(2)}px)`;
        c2.style.transform = `translateY(${(12 * (1 - e2)).toFixed(1)}px)`;
      }
      function renderAt(t) {
        const p = inOut(clamp01((t - __cues[0]) / 2.8));
        revealCopy(t, p);
        fg.render({
          t: t + OFFSET,
          cam: { x: 0.015 * clamp01(t / 4) , y: 0, zoom: 1 + 0.06 * Math.pow(clamp01((t - 4.9) / 1.1), 3) },
          trail: { progress: 1, y: 0.7, h: 0.12 },                          // 컷 2에서 생긴 좁은 첫 바람 자국
          sweep: { progress: p },                                            // 1.5초(15.045)에 시작, 4.3초에 다 지나감
        });
      }
      window.addEventListener('hf-seek', e => renderAt(e.detail.time));
      renderAt(0);

      const tl = gsap.timeline({ paused: true });
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
