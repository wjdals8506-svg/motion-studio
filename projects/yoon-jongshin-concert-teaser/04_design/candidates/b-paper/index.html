<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Pretendard'; font-weight: 400; src: url('assets/fonts/pretendard/Pretendard-Regular.woff2') format('woff2'); }
      @font-face { font-family: 'Pretendard'; font-weight: 600; src: url('assets/fonts/pretendard/Pretendard-SemiBold.woff2') format('woff2'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #efe6d8; }
      #root { width: 100%; height: 100%; position: relative; font-family: 'Pretendard', sans-serif; word-break: keep-all; }
      .clip { position: absolute; inset: 0; }
      canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .copy { position: absolute; left: 0; right: 0; text-align: center; color: #3b2a20; }
      #c1 { top: 13%; font-size: 140px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
      #c2 { top: 29%; font-size: 48px; font-weight: 400; color: #5a4436; }
    </style>
  </head>
  <body>
    <!-- 후보 B: 겹겹이 오린 종이의 저녁 풍경과 기름종이 같은 김 (Styles-20 #8 Paper Cutout). 18.045초 히어로 프레임 -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1920" data-height="1080">
      <section class="clip" id="hero" data-start="0" data-duration="1">
        <canvas id="cv" width="1920" height="1080"></canvas>
        <p class="copy" id="c1">스며드는</p>
        <p class="copy" id="c2">윤종신의 목소리와 이야기</p>
      </section>
    </div>
    <script>
      const W = 1920, H = 1080;
      const rng = (s => () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296))(11);
      const ctx = document.getElementById('cv').getContext('2d');
      const paper = (alpha) => {
        const img = ctx.getImageData(0, 0, W, H), d = img.data;
        for (let i = 0; i < d.length; i += 4) { const n = (rng() - 0.5) * alpha; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
        ctx.putImageData(img, 0, 0);
      };

      // 하늘: 색종이 띠 네 겹
      const bands = ['#7c6a86', '#b58a8c', '#e0a98a', '#f1c792'];
      bands.forEach((c, i) => {
        ctx.fillStyle = c;
        ctx.beginPath(); ctx.moveTo(0, H * (0.1 + i * 0.16));
        for (let x = 0; x <= W; x += 60) ctx.lineTo(x, H * (0.1 + i * 0.16) + Math.sin(x / 210 + i) * 10);
        ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
      });
      // 해: 반쯤 가린 둥근 종이
      ctx.fillStyle = '#f7dcae'; ctx.beginPath(); ctx.arc(W * 0.7, H * 0.66, 120, 0, Math.PI * 2); ctx.fill();

      // 도시: 깊이가 다른 오린 종이 세 겹, 앞 겹일수록 짙고 그림자가 깊다
      const layer = (base, minH, maxH, color, shadow, lit) => {
        ctx.save(); ctx.shadowColor = 'rgba(40,24,18,0.35)'; ctx.shadowBlur = shadow; ctx.shadowOffsetY = shadow / 3;
        ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(-10, H);
        let x = -10; const wins = [];
        while (x < W + 10) {
          const w = 70 + rng() * 150, h = minH + rng() * (maxH - minH);
          ctx.lineTo(x, base - h); ctx.lineTo(x + w, base - h);
          if (lit) for (let wy = base - h + 22; wy < base - 16; wy += 34) for (let wx = x + 16; wx < x + w - 18; wx += 30) if (rng() < 0.28) wins.push([wx, wy]);
          x += w;
        }
        ctx.lineTo(W + 10, H); ctx.closePath(); ctx.fill(); ctx.restore();
        ctx.fillStyle = '#f6c56f'; for (const [wx, wy] of wins) ctx.fillRect(wx, wy, 12, 16);
      };
      layer(H * 0.78, 80, 220, '#8d6f7e', 10, false);
      layer(H * 0.88, 120, 300, '#5a4352', 16, true);
      layer(H * 1.0, 60, 160, '#33242e', 22, true);
      paper(18);

      // 김: 기름종이 한 장이 창 전체를 덮고, 바람이 찢어 낸 자리로 풍경이 보인다
      const tear = [];
      const j = a => (rng() - 0.5) * a;
      for (let t = 0; t <= 1; t += 0.02) tear.push([W * (0.08 + 0.84 * t), H * (0.42 + 0.03 * Math.sin(t * 7) + j(0.03))]);
      for (let t = 0; t <= 1; t += 0.05) tear.push([W * (0.92 + 0.05 * Math.sin(t * 4) + j(0.02)), H * (0.42 + 0.5 * t)]);
      for (let t = 1; t >= 0; t -= 0.02) tear.push([W * (0.08 + 0.84 * t), H * (0.93 + j(0.035))]);
      for (let t = 1; t >= 0; t -= 0.05) tear.push([W * (0.08 - 0.04 * Math.sin(t * 5) + j(0.02)), H * (0.42 + 0.5 * t)]);
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.moveTo(tear[0][0], tear[0][1]); for (const [x, y] of tear) ctx.lineTo(x, y); ctx.closePath();
      ctx.shadowColor = 'rgba(40,24,18,0.38)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 8;
      ctx.fillStyle = 'rgba(241,233,220,0.9)'; ctx.fill('evenodd');
      ctx.restore();
      paper(10);

      const tl = gsap.timeline({ paused: true });
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
