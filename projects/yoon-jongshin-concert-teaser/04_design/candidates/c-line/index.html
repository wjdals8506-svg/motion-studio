<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Pretendard'; font-weight: 400; src: url('assets/fonts/pretendard/Pretendard-Regular.woff2') format('woff2'); }
      @font-face { font-family: 'Pretendard'; font-weight: 600; src: url('assets/fonts/pretendard/Pretendard-SemiBold.woff2') format('woff2'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f1ebe1; }
      #root { width: 100%; height: 100%; position: relative; font-family: 'Pretendard', sans-serif; word-break: keep-all; }
      .clip { position: absolute; inset: 0; }
      svg { position: absolute; inset: 0; }
      .copy { position: absolute; left: 0; right: 0; text-align: center; color: #2f2924; }
      #c1 { top: 39%; font-size: 140px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
      #c2 { top: 55%; font-size: 48px; font-weight: 400; color: #5b524a; }
    </style>
  </head>
  <body>
    <!-- 후보 C: 미색 종이 위 한 가닥 선으로 그린 창 (Styles-20 #16 Line Animation). 18.045초 히어로 프레임 -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1920" data-height="1080">
      <section class="clip" id="hero" data-start="0" data-duration="1">
        <svg id="sv" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
        <p class="copy" id="c1">스며드는</p>
        <p class="copy" id="c2">윤종신의 목소리와 이야기</p>
      </section>
    </div>
    <script>
      const W = 1920, H = 1080, NS = 'http://www.w3.org/2000/svg';
      const rng = (s => () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296))(23);
      const sv = document.getElementById('sv');
      const el = (tag, attrs, parent = sv) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
      const INK = '#3a332d';

      // 바람이 닦아 낸 띠: 이 바깥에만 김(점묘)이 남는다
      const band = [];
      for (let t = 0; t <= 1; t += 0.02) band.push([W * (0.04 + 0.92 * t), H * (0.3 + 0.04 * Math.sin(t * 6))]);
      for (let t = 1; t >= 0; t -= 0.02) band.push([W * (0.04 + 0.92 * t), H * (0.86 + 0.03 * Math.sin(t * 5 + 1))]);
      const bandD = 'M' + band.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L') + ' Z';
      const defs = el('defs', {});
      const mask = el('mask', { id: 'fogmask' }, defs);
      el('rect', { x: 0, y: 0, width: W, height: H, fill: 'white' }, mask);
      el('path', { d: bandD, fill: 'black' }, mask);
      const fog = el('g', { mask: 'url(#fogmask)' });
      for (let i = 0; i < 16000; i++) el('circle', { cx: (rng() * W).toFixed(1), cy: (rng() * H).toFixed(1), r: (0.8 + rng() * 1.8).toFixed(2), fill: INK, opacity: (0.14 + rng() * 0.2).toFixed(2) }, fog);

      // 창틀: 가는 선 하나
      el('rect', { x: 70, y: 60, width: W - 140, height: H - 120, fill: 'none', stroke: INK, 'stroke-width': 3 });
      // 닦인 띠 안의 도시: 한 붓 선의 스카이라인
      let x = 70, d = `M70 ${H * 0.8}`;
      while (x < W - 70) { const w = Math.min(60 + rng() * 140, W - 70 - x), h = H * (0.6 + rng() * 0.16); d += ` L${x.toFixed(0)} ${h.toFixed(0)} L${(x + w).toFixed(0)} ${h.toFixed(0)}`; x += w; }
      d += ` L${W - 70} ${H * 0.8}`;
      el('path', { d, fill: 'none', stroke: INK, 'stroke-width': 2.5, 'stroke-linejoin': 'round', mask: '' });
      // 불빛: 유일한 색(호박색) — 의미는 "저녁이 왔다"
      for (let i = 0; i < 22; i++) el('circle', { cx: (120 + rng() * (W - 240)).toFixed(0), cy: (H * (0.66 + rng() * 0.14)).toFixed(0), r: (4 + rng() * 5).toFixed(1), fill: '#d9913f' });
      // 바람의 궤적: 띠를 따라 지나간 한 줄
      let wd = '';
      for (let t = 0; t <= 1; t += 0.01) wd += (t ? ' L' : 'M') + (W * (0.02 + 0.96 * t)).toFixed(1) + ' ' + (H * (0.9 - 0.06 * Math.sin(t * 3.1)) ).toFixed(1);
      el('path', { d: wd, fill: 'none', stroke: INK, 'stroke-width': 2, 'stroke-dasharray': '2 10', 'stroke-linecap': 'round', opacity: 0.6 });

      const tl = gsap.timeline({ paused: true });
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
