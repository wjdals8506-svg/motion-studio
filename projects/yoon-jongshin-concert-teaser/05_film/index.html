<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/js/fog-glass.js"></script>
    <style>
      @font-face { font-family: 'Pretendard'; font-weight: 700; src: url('assets/fonts/pretendard/Pretendard-Bold.woff2') format('woff2'); }
      @font-face { font-family: 'Pretendard'; font-weight: 400; src: url('assets/fonts/pretendard/Pretendard-Regular.woff2') format('woff2'); }
      @font-face { font-family: 'Pretendard'; font-weight: 600; src: url('assets/fonts/pretendard/Pretendard-SemiBold.woff2') format('woff2'); }
      :root {
        --color-ground: #2b2738;
        --color-ink: #f6efe4;
        --color-muted: #d8cbbb;
        --color-accent: #ffc482;
        --font-sans: 'Pretendard', sans-serif;
        --type-headline-size: 140px;
        --type-headline-weight: 600;
        --type-headline-line: 1;
        --type-headline-tracking: -0.02em;
        --type-headline-family: var(--font-sans);
        --type-sub-size: 49px;
        --type-sub-weight: 400;
        --type-sub-line: 1.3;
        --type-sub-tracking: -0.01em;
        --type-sub-family: var(--font-sans);
        --type-line-size: 65px;
        --type-line-weight: 400;
        --type-line-line: 1.25;
        --type-line-tracking: -0.01em;
        --type-line-family: var(--font-sans);
        --type-cities-size: 43px;
        --type-cities-weight: 400;
        --type-cities-line: 1.2;
        --type-cities-tracking: 0em;
        --type-cities-family: var(--font-sans);
        --type-info-size: 38px;
        --type-info-weight: 400;
        --type-info-line: 1.4;
        --type-info-tracking: 0em;
        --type-info-family: var(--font-sans);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground); }
      #root { width: 100%; height: 100%; position: relative; word-break: keep-all; }
      .clip { position: absolute; inset: 0; }
      #cv { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .w { position: absolute; white-space: nowrap; font-family: var(--type-headline-family); color: var(--color-ink); text-shadow: 0 2px 26px rgba(20, 14, 10, 0.55); visibility: hidden; }
      .big { font-size: var(--type-headline-size); font-weight: var(--type-headline-weight); letter-spacing: var(--type-headline-tracking); line-height: 1; }
      .mid { font-size: calc(var(--type-headline-size) * 0.8); font-weight: var(--type-headline-weight); letter-spacing: var(--type-headline-tracking); line-height: 1; }
      .ch { display: inline-block; }
      #final { position: absolute; inset: 0; font-family: var(--type-headline-family); }
      #final .ln { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; font-size: calc(var(--type-headline-size) * 0.72); font-weight: var(--type-headline-weight); letter-spacing: var(--type-headline-tracking); line-height: 1; color: var(--color-ink); text-shadow: 0 2px 26px rgba(20, 14, 10, 0.55); }
      #final .l1 { top: 30%; visibility: hidden; }
      #final .l2 { top: 42%; }
      #final .fw { display: inline-block; visibility: hidden; }
      .title { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-family: var(--type-headline-family); font-size: calc(var(--type-headline-size) * 1.08); font-weight: var(--type-headline-weight); letter-spacing: var(--type-headline-tracking); line-height: 1; color: var(--color-ink); text-shadow: 0 2px 30px rgba(20, 14, 10, 0.6); visibility: hidden; }
      .info { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--type-info-family); font-size: var(--type-info-size); font-weight: var(--type-info-weight); color: var(--color-muted); text-shadow: 0 1px 16px rgba(20, 14, 10, 0.7); visibility: hidden; white-space: nowrap; }
      .info.sub { font-size: var(--type-sub-size); color: var(--color-ink); top: 55%; }
      #date { top: 62%; }
      #cities { top: 67%; }
    </style>
  </head>
  <body>
    <!-- 2단계 2차: 끊지 않는 한 샷. 맑은 창(가장자리만 김) 위에서 카피가 박에 맞춰 놓인다. 캔버스와 카피는 clip 하나(0~30초) -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <section class="clip" id="shot" data-start="0" data-duration="30">
        <canvas id="cv" width="1920" height="1080"></canvas>
        <span class="w big" id="a1" style="left: 34%; top: 58%">서늘한</span>
        <span class="w mid" id="a2" style="left: 64%; top: 40%">바람처럼</span>
        <span class="w big" id="b1" style="left: 50%; top: 46%"><span class="ch">스</span><span class="ch">며</span><span class="ch">드</span><span class="ch">는</span></span>
        <span class="w big" id="k2" style="left: 30%; top: 46%">윤종신의</span>
        <span class="w mid" id="k3" style="left: 70%; top: 58%">목소리와</span>
        <span class="w big" id="k4" style="left: 48%; top: 72%">이야기</span>
        <div id="final"><p class="ln l1" id="f1">서늘한 바람처럼 스며드는</p><p class="ln l2"><span class="fw" id="f2">윤종신의</span> <span class="fw" id="f3">목소리와</span> <span class="fw" id="f4">이야기</span></p></div>
        <p class="info sub" id="tour">2026 윤종신 전국투어 콘서트</p>
        <p class="title" id="title">가을냄새</p>
        <p class="info" id="date">10. 2 서울에서 시작, 11월까지</p>
        <p class="info" id="cities">서울 · 인천 · 수원 · 고양 · 부산 · 경주 · 대전</p>
      </section>
      <audio id="bgm" src="assets/audio/bgm.mp3" data-start="0" data-duration="30" data-media-start="0" data-volume="1"></audio>
    </div>
    <script type="application/json" id="qa">
      {
        "copyWindows": [
          { "copy": "서늘한 바람처럼", "from": 2.27, "to": 3.45 },
          { "copy": "스며드는", "from": 11.3, "to": 12.9 },
          { "copy": "서늘한 바람처럼 스며드는\n윤종신의 목소리와 이야기", "from": 18.4, "to": 22.4 },
          { "copy": "2026 윤종신 전국투어 콘서트", "from": 20.65, "to": 30 },
          { "copy": "가을냄새", "from": 24.045, "to": 30 },
          { "copy": "10. 2 서울에서 시작, 11월까지", "from": 25.5, "to": 30 },
          { "copy": "서울 · 인천 · 수원 · 고양 · 부산 · 경주 · 대전", "from": 26.0, "to": 30 }
        ],
        "endHold": 1.2
      }
    </script>
    <script>
      window.__cues = [18.045,24.045];
      window.__timing = {"beats":[{"n":1,"start":0,"dur":3.045,"keyMotions":[]},{"n":2,"start":3.045,"dur":4.5,"keyMotions":[]},{"n":3,"start":7.545,"dur":6,"keyMotions":[]},{"n":4,"start":13.545,"dur":6,"keyMotions":[18.045]},{"n":5,"start":19.545,"dur":4.5,"keyMotions":[]},{"n":6,"start":24.045,"dur":5.955,"keyMotions":[24.045]}],"duration":30};
      // ── 시각 표: 컷 경계·키 모션은 timing.json, 카피 시각은 02_story.md "카피가 놓이는 시각"(3단계 박자 지도) ──
      const T = window.__timing, B = n => T.beats.find(b => b.n === n);
      const C2 = B(2).start, C3 = B(3).start, C4 = B(4).start, C5 = B(5).start, C6 = B(6).start, END = T.duration;
      const HERO = B(4).keyMotions[0], TITLE = B(6).keyMotions[0], HOLD = END - 1.2;
      const AT = { cool: 1.52, wind: 2.27, letters: [9.045, 9.795, 10.545, 11.295], w2: 15.02, w3: 16.52, w4: 17.27, tour: 20.65, date: 25.5, cities: 26.0 };
      const clamp01 = x => Math.min(1, Math.max(0, x));
      const span = (t, a, b) => clamp01((t - a) / (b - a));
      const inOut = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

      const fg = FogGlass.create(document.getElementById('cv'), { seed: 7 });
      function renderAt(t) {
        const tt = Math.min(t, HOLD);
        // 컷 2: 박마다 불빛이 하나씩 더 켜진다(3.045초부터 0.75초 간격, 6단계)
        const steps = tt < C2 ? 0 : Math.min(6, Math.floor((tt - C2) / 0.75) + 1);
        const zoom = (1.08 - 0.08 * inOut(span(tt, 0, C3)))                        // 컷 1~2: 천천히 물러남
          * (1 + 0.045 * Math.pow(span(tt, HERO + 0.4, C5), 2))                      // 컷 4 끝: 밀고 들어감
          / (1 + 0.045 * inOut(span(tt, C5, C6)))                                     // 컷 5: 같은 길로 물러남
          * (1 + 0.02 * span(tt, C6, HOLD));
        fg.render({
          t: tt, clear: 1, refog: 0.3, lightsOn: 0.3 + 0.7 * steps / 6,
          cam: { x: 0.02 * inOut(span(tt, C2, C4 + 2)), y: 0, zoom },
        });
      }
      window.addEventListener('hf-seek', e => renderAt(e.detail.time));
      renderAt(0);

      // ── DOM 카피: 박에 착지(0.9초 전 출발, power2.out), 퇴장은 흐려지며 가속(power2.in). 불투명도 페이드 없음 ──
      const tl = gsap.timeline({ paused: true });
      gsap.set('.w', { xPercent: -50, yPercent: -50 });
      const land = (id, at, from, dur = 0.9) => {
        tl.set(id, { visibility: 'visible' }, at - dur);
        tl.fromTo(id, { ...from, filter: 'blur(4px)' }, { x: 0, y: 0, scale: 1, filter: 'blur(0px)', duration: dur, ease: 'power2.out' }, at - dur);
      };
      const leave = (id, at, to, dur = 0.45) => {
        tl.to(id, { ...to, filter: 'blur(10px)', duration: dur, ease: 'power2.in' }, at);
        tl.set(id, { visibility: 'hidden' }, at + dur);
      };
      // 컷 1: "서늘한"(첫 음) · "바람처럼"(다음 박), 바람 방향(왼→오)으로 들어오고 같은 방향으로 빠진다
      land('#a1', AT.cool, { x: -140 });
      land('#a2', AT.wind, { x: -120 });
      leave('#a1', C2 + 0.4, { x: 160 });
      leave('#a2', C2 + 0.5, { x: 180 });
      // 컷 3: "스·며·드·는" 한 박에 한 글자씩, 컷 4 전에 사라진다
      tl.set('#b1', { visibility: 'visible' }, AT.letters[0] - 0.6);
      document.querySelectorAll('#b1 .ch').forEach((ch, i) => {
        tl.fromTo(ch, { y: 40, filter: 'blur(4px)', visibility: 'hidden' }, { y: 0, filter: 'blur(0px)', visibility: 'visible', duration: 0.6, ease: 'power2.out' }, AT.letters[i] - 0.6);
      });
      leave('#b1', C4 - 0.6, { y: -24, scale: 0.96 });
      tl.set('#b1 .ch', { visibility: 'hidden' }, C4 - 0.15);             // 글자마다 visible을 따로 줬으므로 글자도 함께 숨긴다
      // 컷 4: 세 단어가 차례로 → 정점에 두 덩이로 모임(4단계 승인 키 컷과 같다)
      land('#k2', AT.w2, { x: -180 });
      land('#k3', AT.w3, { y: 60 });
      land('#k4', AT.w4, { y: -40, scale: 1.12 });
      // 컷 5: 공연 줄이 강음(20.65)에 착지, 키메시지는 제목이 오기 전에 빠진다
      land('#tour', AT.tour, { y: 30 });
      // 컷 6: '가을냄새'가 곡이 내려앉는 순간(24.045) 크게 착지, 기간·도시가 이어서. 28.8초부터 정지
      land('#title', TITLE, { y: 30, scale: 1.04 }, 0.75);
      land('#date', AT.date, { y: 18 }, 0.7);
      land('#cities', AT.cities, { y: 18 }, 0.7);

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.sentence = document.fonts.load("600 140px 'Pretendard'").then(() => {
        ['k2', 'k3', 'k4'].forEach((id, i) => {
          const k = document.getElementById(id), f = document.getElementById('f' + (i + 2)), b = f.getBoundingClientRect();
          const ax = parseFloat(k.style.left) / 100 * 1920, ay = parseFloat(k.style.top) / 100 * 1080;
          const sc = parseFloat(getComputedStyle(f).fontSize) / parseFloat(getComputedStyle(k).fontSize);
          tl.to(k, { x: b.left + b.width / 2 - ax, y: b.top + b.height / 2 - ay, scale: sc, duration: 1.2, ease: 'power2.inOut' }, HERO - 0.45 + 0.06 * i);
          leave(k, TITLE - 1.6 + 0.05 * i, { y: '-=24', scale: sc * 0.96 });   // 제목이 오기 0.85초 전에 다 빠진다
        });
        tl.set('#f1', { visibility: 'visible' }, HERO + 0.25);
        tl.fromTo('#f1', { y: 26, filter: 'blur(6px)' }, { y: 0, filter: 'blur(0px)', duration: 1.1, ease: 'power2.out' }, HERO + 0.25);
        leave('#f1', TITLE - 1.65, { y: -24, scale: 0.96 });
        window.__timelines['main'] = tl;                                    // 트윈을 다 넣은 뒤 등록(엔진 규칙)
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
        tl.seek(0);
      });
    </script>
  </body>
</html>
