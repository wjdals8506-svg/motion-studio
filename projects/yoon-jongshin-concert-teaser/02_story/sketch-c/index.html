<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
    <style>
      @font-face { font-family: 'GowunBatang'; font-weight: 700; src: url('assets/fonts/gowunbatang/GowunBatang-Bold.ttf'); }
      @font-face { font-family: 'GowunBatang'; font-weight: 400; src: url('assets/fonts/gowunbatang/GowunBatang-Regular.ttf'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; position: relative; word-break: keep-all; font-family: 'GowunBatang', serif; color: #f4ece0; }
      /* 비교 시험판: 곡 13.545~21.045초 구간을 A 지금 / B 실사 + 코드 마감 / C three.js 3D 무대로 7.5초씩 */
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .fx { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .line { position: absolute; left: 192px; top: 80px; font-weight: 400; font-size: 72px; letter-spacing: -0.01em; white-space: nowrap; visibility: hidden; text-shadow: 0 2px 24px rgba(0,0,0,0.55); }
      .tag { position: absolute; right: 40px; bottom: 32px; font-size: 28px; color: rgba(244,236,224,0.7); font-family: sans-serif; }
      /* B: 한 영화로 묶는 색(따뜻한 그림자, 눌린 하이라이트)과 렌즈 가장자리 */
      .bshot { filter: contrast(1.08) saturate(0.82) sepia(0.12) brightness(0.92); }
      #gradeB { position: absolute; inset: 0; background: #b06a2c; mix-blend-mode: soft-light; opacity: 0.35; }
      #vigB { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
      #grainB { mix-blend-mode: overlay; opacity: 0.22; }
      #lB { color: #fff0dc; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22.5" data-width="1920" data-height="1080">
      <!-- A: 지금 판(실사 스케치 2차와 같음) -->
      <video id="a1" class="clip shot" src="assets/video/branches-6677775.mp4" muted playsinline data-start="0" data-duration="1.5" data-media-start="14.5"></video>
      <video id="a2" class="clip shot" src="assets/video/guitar-7722894.mp4" muted playsinline data-start="1.5" data-duration="2.5" data-media-start="0"></video>
      <video id="a3" class="clip shot" src="assets/video/mic-8197868.mp4" muted playsinline data-start="4" data-duration="2" data-media-start="2"></video>
      <video id="a4" class="clip shot" src="assets/video/turntable-3116506.mp4" muted playsinline data-start="6" data-duration="1.5" data-media-start="3"></video>
      <section class="clip" id="secA" data-start="0" data-duration="7.5">
        <p class="line" id="lA">윤종신의 목소리와 이야기</p>
        <p class="tag">A · 지금</p>
      </section>
      <!-- B: 같은 실사 + 코드 마감(색 통일, 그레인, 비네팅, 빛줄기와 먼지, 빛을 받는 글자) -->
      <video id="b1" class="clip shot bshot" src="assets/video/branches-6677775.mp4" muted playsinline data-start="7.5" data-duration="1.5" data-media-start="14.5"></video>
      <video id="b2" class="clip shot bshot" src="assets/video/guitar-7722894.mp4" muted playsinline data-start="9" data-duration="2.5" data-media-start="0"></video>
      <video id="b3" class="clip shot bshot" src="assets/video/mic-8197868.mp4" muted playsinline data-start="11.5" data-duration="2" data-media-start="2"></video>
      <video id="b4" class="clip shot bshot" src="assets/video/turntable-3116506.mp4" muted playsinline data-start="13.5" data-duration="1.5" data-media-start="3"></video>
      <section class="clip" id="secB" data-start="7.5" data-duration="7.5">
        <div id="gradeB" data-layout-allow-occlusion></div>
        <div id="vigB" data-layout-allow-occlusion></div>
        <p class="line" id="lB">윤종신의 목소리와 이야기</p>
        <canvas id="dustB" class="fx" width="1920" height="1080" data-layout-allow-occlusion data-layout-allow-overlap></canvas>
        <canvas id="grainB" class="fx" width="480" height="270" data-layout-allow-occlusion data-layout-allow-overlap></canvas>
        <p class="tag">B · 실사 + 코드 마감</p>
      </section>
      <!-- C: three.js로 만든 무대, 15초에 조명이 켜짐 -->
      <section class="clip" id="secC" data-start="15" data-duration="7.5">
        <canvas id="gl" class="fx" width="1920" height="1080" data-layout-allow-occlusion data-layout-allow-overlap></canvas>
        <p class="line" id="lC">윤종신의 목소리와 이야기</p>
        <p class="tag">C · 3D 무대(three.js)</p>
      </section>
    </div>
    <script>
      // 시드 고정 난수: 프레임마다 같은 그림이 나와야 한다(프레임 단위 렌더)
      const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
      const clamp01 = x => Math.max(0, Math.min(1, x));
      const smooth = (a, b, x) => { const u = clamp01((x - a) / (b - a)); return u * u * (3 - 2 * u); };

      // ---------- B: 그레인 타일 8장, 빛줄기와 먼지 ----------
      const grain = document.getElementById('grainB').getContext('2d');
      const tiles = Array.from({ length: 8 }, (_, k) => {
        const r = rng(101 + k), img = grain.createImageData(480, 270);
        for (let i = 0; i < img.data.length; i += 4) { const v = 128 + (r() - 0.5) * 120; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
        return img;
      });
      const dust = document.getElementById('dustB').getContext('2d');
      const r1 = rng(7);
      const motes = Array.from({ length: 320 }, () => ({ x: r1() * 1920, y: r1() * 1080, s: 0.6 + r1() * 2.2, ph: r1() * 6.28, v: 6 + r1() * 18 }));
      function beamAt(tb) {
        // 무대 조명 장면(1.5~4초)은 위 오른쪽에서, 마이크 장면(4~6초)은 위 왼쪽에서 비스듬히
        return tb < 4 ? { x0: 1500, x1: 700, w0: 120, w1: 620 } : { x0: 420, x1: 1080, w0: 110, w1: 560 };
      }
      function drawB(t) {
        const tb = t - 7.5;
        grain.putImageData(tiles[Math.floor(t * 24) % 8], 0, 0);
        dust.clearRect(0, 0, 1920, 1080);
        if (tb < 1.5 || tb >= 6) return;
        const b = beamAt(tb), on = smooth(1.5, 2.1, tb) * (tb < 4 ? 1 : smooth(4.0, 4.4, tb));
        const g = dust.createLinearGradient(0, 0, 0, 1080);
        g.addColorStop(0, `rgba(255,214,160,${0.38 * on})`); g.addColorStop(1, 'rgba(255,214,160,0)');
        dust.globalCompositeOperation = 'screen';
        dust.filter = 'blur(28px)';
        dust.fillStyle = g;
        dust.beginPath(); dust.moveTo(b.x0 - b.w0, 0); dust.lineTo(b.x0 + b.w0, 0); dust.lineTo(b.x1 + b.w1, 1080); dust.lineTo(b.x1 - b.w1, 1080); dust.closePath(); dust.fill();
        dust.filter = 'none';
        for (const m of motes) {
          const y = ((m.y - tb * m.v) % 1080 + 1080) % 1080, x = m.x + Math.sin(tb * 0.6 + m.ph) * 14;
          const cx = b.x0 + (b.x1 - b.x0) * (y / 1080), w = b.w0 + (b.w1 - b.w0) * (y / 1080);
          const inBeam = 1 - smooth(w * 0.6, w * 1.1, Math.abs(x - cx));
          const a = (0.75 * inBeam) * on;
          if (a < 0.02) continue;
          dust.fillStyle = `rgba(255,226,190,${a})`;
          dust.beginPath(); dust.arc(x, y, m.s, 0, 6.283); dust.fill();
        }
        dust.globalCompositeOperation = 'source-over';
      }

      // ---------- C: three.js 무대 ----------
      const R = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
      R.setPixelRatio(1); R.setSize(1920, 1080, false);
      R.outputEncoding = THREE.sRGBEncoding; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.15;
      R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050403); scene.fog = new THREE.FogExp2(0x0b0806, 0.06);
      const cam = new THREE.PerspectiveCamera(28, 1920 / 1080, 0.1, 100);
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x3a2618, roughness: 0.42, metalness: 0.05 }));
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
      // 뒤 막: 세로 주름 무늬를 캔버스로 그린 질감
      const cc = document.createElement('canvas'); cc.width = 1024; cc.height = 8; const cg = cc.getContext('2d');
      for (let x = 0; x < 1024; x++) { const v = 0.55 + 0.45 * Math.sin(x / 1024 * Math.PI * 46) * Math.sin(x / 1024 * Math.PI * 9 + 1); cg.fillStyle = `rgb(${Math.round(70 * v)},${Math.round(22 * v)},${Math.round(18 * v)})`; cg.fillRect(x, 0, 1, 8); }
      const curtainTex = new THREE.CanvasTexture(cc); curtainTex.encoding = THREE.sRGBEncoding;
      const curtain = new THREE.Mesh(new THREE.PlaneGeometry(30, 12), new THREE.MeshStandardMaterial({ map: curtainTex, roughness: 1 }));
      curtain.position.set(0, 6, -4.5); curtain.receiveShadow = true; scene.add(curtain);
      // 마이크 스탠드
      const metal = new THREE.MeshStandardMaterial({ color: 0x1b1b1d, roughness: 0.35, metalness: 0.8 });
      const chrome = new THREE.MeshStandardMaterial({ color: 0xcfc8bd, roughness: 0.3, metalness: 0.65 });
      const stand = new THREE.Group();
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.34, 0.04, 48), metal); base.position.y = 0.02;
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 1.42, 24), metal); pole.position.y = 0.75;
      const clip = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.08, 24), metal); clip.position.y = 1.48;
      const head = new THREE.Mesh(new THREE.CapsuleGeometry(0.075, 0.15, 12, 32), chrome); head.position.set(0, 1.62, 0.02); head.rotation.x = 0.35;
      [base, pole, clip, head].forEach(m => { m.castShadow = true; stand.add(m); });
      scene.add(stand);
      const aim = new THREE.Vector3(0, 1.55, 0);
      scene.add(new THREE.AmbientLight(0x2a2018, 0.22));
      const fill = new THREE.PointLight(0xffd2a0, 0, 6, 1.5); fill.position.set(0.9, 1.9, 2.2); scene.add(fill);
      const spot = new THREE.SpotLight(0xffcf9a, 0, 22, 0.2, 0.6, 1.1); spot.position.set(0.7, 6.6, 1.3); spot.target.position.copy(aim);
      spot.castShadow = true; spot.shadow.mapSize.set(1024, 1024); scene.add(spot, spot.target);
      const rim = new THREE.SpotLight(0xff9a50, 0, 16, 0.5, 0.9, 1.2); rim.position.set(-0.4, 3.8, -3.6); rim.target.position.copy(aim); scene.add(rim, rim.target);
      // 빛줄기: 시선 방향으로 가장자리가 흐려지는 원뿔(가산 혼합)
      const dir = new THREE.Vector3().subVectors(new THREE.Vector3(0, 0, 0.1), spot.position); const len = dir.length();
      const beamMat = new THREE.ShaderMaterial({
        uniforms: { uI: { value: 0 }, uColor: { value: new THREE.Color(0xffd7a8) } },
        vertexShader: 'varying vec2 vUv; varying vec3 vN; varying vec3 vV; void main(){ vUv=uv; vN=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.0); vV=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }',
        fragmentShader: 'uniform float uI; uniform vec3 uColor; varying vec2 vUv; varying vec3 vN; varying vec3 vV; void main(){ float e=pow(abs(dot(vN,vV)),2.0); float f=mix(0.15,1.0,vUv.y); gl_FragColor=vec4(uColor*uI*e*f*0.6,1.0); }',
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      });
      const beam = new THREE.Mesh(new THREE.ConeGeometry(Math.tan(0.2) * len * 1.05, len, 64, 1, true), beamMat);
      beam.position.copy(spot.position).addScaledVector(dir, 0.5);
      beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), dir.clone().normalize());
      scene.add(beam);
      // 빛 속 먼지: 원뿔 축에서 가까울수록 밝다
      const N = 6000, r2 = rng(11), basePos = new Float32Array(N * 3), ph = new Float32Array(N);
      for (let i = 0; i < N; i++) { basePos[i * 3] = (r2() - 0.5) * 6; basePos[i * 3 + 1] = r2() * 4.6; basePos[i * 3 + 2] = (r2() - 0.5) * 5; ph[i] = r2() * 6.28; }
      const dGeo = new THREE.BufferGeometry();
      dGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
      dGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
      const motesC = new THREE.Points(dGeo, new THREE.PointsMaterial({ size: 0.013, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
      scene.add(motesC);
      const axisDir = dir.clone().normalize(), tmp = new THREE.Vector3();
      const ease = x => 0.5 - 0.5 * Math.cos(Math.PI * clamp01(x));
      function drawC(t) {
        const tc = t - 15;
        const on = smooth(1.5, 2.2, tc), back = smooth(6.0, 6.8, tc);
        spot.intensity = 2.4 * on; rim.intensity = 1.4 * back; fill.intensity = 0.5 * on; beamMat.uniforms.uI.value = on;
        const k = ease(tc / 7.5);
        cam.position.set(0.45 - 0.25 * k, 1.25 + 0.2 * k, 4.6 - 1.4 * k); cam.lookAt(0, 1.3, 0);
        const pos = dGeo.attributes.position.array, col = dGeo.attributes.color.array;
        for (let i = 0; i < N; i++) {
          const x = basePos[i * 3] + Math.sin(tc * 0.35 + ph[i]) * 0.06, y = ((basePos[i * 3 + 1] + tc * 0.035) % 4.6), z = basePos[i * 3 + 2] + Math.cos(tc * 0.3 + ph[i]) * 0.05;
          pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
          tmp.set(x, y, z).sub(spot.position); const along = tmp.dot(axisDir); const radial = tmp.addScaledVector(axisDir, -along).length();
          const coneR = Math.tan(0.2) * Math.max(along, 0.01);
          const b = (1 - smooth(coneR * 0.45, coneR * 1.0, radial)) * on * 1.1;
          col[i * 3] = b; col[i * 3 + 1] = b * 0.88; col[i * 3 + 2] = b * 0.72;
        }
        dGeo.attributes.position.needsUpdate = true; dGeo.attributes.color.needsUpdate = true;
        R.render(scene, cam);
      }

      window.__timelines = window.__timelines || {};
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.compare = Promise.all(["400 60px 'GowunBatang'"].map(f => document.fonts.load(f, '윤종신의목소리와이야기')))
        .then(() => {
          const tl = gsap.timeline({ paused: true });
          const proxy = { t: 0 };
          const draw = () => { const t = proxy.t; if (t >= 7.5 && t < 15) drawB(t); if (t >= 15) drawC(t); };
          // 진행 시간을 그리는 프록시(선형): B·C는 시간의 함수로만 그린다
          tl.to(proxy, { t: 22.5, duration: 22.5, ease: 'none', onUpdate: draw }, 0);
          const seep = (sel, at, dur) => {
            tl.set(sel, { visibility: 'visible' }, at);
            tl.fromTo(sel, { opacity: 0, filter: 'blur(14px)' }, { opacity: 1, filter: 'blur(0px)', duration: dur, ease: 'power2.out' }, at);
          };
          seep('#lA', 4.055, 1.1); tl.set('#lA', { visibility: 'hidden' }, 6);
          seep('#lB', 11.555, 1.1); tl.set('#lB', { visibility: 'hidden' }, 13.5);
          seep('#lC', 19.055, 1.1);
          tl.set({}, {}, 22.5);
          window.__timelines['main'] = tl;
          if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
          tl.seek(0); draw();
        });
    </script>
  </body>
</html>
