<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A·B 대표 장면 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap">
<style>
  body { margin: 0; background: #16161a; color: #d9d4cc; font-family: Pretendard, sans-serif; padding: 24px 16px 48px; }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  p.note { font-size: 13px; color: #9a958d; margin: 0 0 24px; line-height: 1.6; }
  h2 { font-size: 15px; font-weight: 600; margin: 28px 0 8px; }
  .frame { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; border-radius: 4px; background: #000; }
  .frame canvas, .frame svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  button { margin-top: 8px; background: #2a2a30; color: #d9d4cc; border: 0; padding: 6px 12px; border-radius: 4px; font: inherit; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>A·B 대표 장면 스케치</h1>
  <p class="note">버리는 시안입니다. 각 안의 대표 장면만 8~9초로 만들었고 소리는 없습니다. 색과 서체는 4단계(디자인)에서 다시 정합니다. 두 장면은 자동으로 반복됩니다.</p>

  <h2>A. 창에 스며드는 바람 — 바람이 김을 닦아 낸 자리에 문장이 드러난다</h2>
  <div class="frame"><canvas id="a" width="1280" height="720"></canvas></div>
  <button data-replay="a">처음부터</button>

  <h2>B. 단어가 연기하는 가을 — "눅눅한"이 "서늘한"으로, "스며드는"이 종이에 배어든다</h2>
  <div class="frame" id="bframe">
    <canvas id="paper" width="1280" height="720"></canvas>
    <svg id="b" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
      <defs>
        <filter id="damp" x="-20%" y="-40%" width="140%" height="180%">
          <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G" result="d"/>
          <feGaussianBlur in="d" stdDeviation="2.4"/>
        </filter>
        <filter id="crisp" x="-10%" y="-30%" width="120%" height="160%">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="2" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="bleed" x="-20%" y="-40%" width="140%" height="180%">
          <feMorphology id="bleedDil" operator="dilate" radius="0" in="SourceGraphic" result="m"/>
          <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" seed="9" result="n"/>
          <feDisplacementMap id="bleedDisp" in="m" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G" result="d"/>
          <feGaussianBlur id="bleedBlur" in="d" stdDeviation="6"/>
        </filter>
        <filter id="halo" x="-30%" y="-60%" width="160%" height="220%">
          <feMorphology id="haloDil" operator="dilate" radius="0" in="SourceGraphic" result="m"/>
          <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="11" result="n"/>
          <feDisplacementMap in="m" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G" result="d"/>
          <feGaussianBlur in="d" stdDeviation="5"/>
        </filter>
      </defs>
      <g font-family="'Noto Serif KR', serif" text-anchor="middle">
        <text id="w1" x="640" y="300" font-size="64" font-weight="500"></text>
        <text id="w2" x="760" y="300" font-size="64" font-weight="500" fill="#3c4350" opacity="0" >바람처럼</text>
        <text id="w3h" x="640" y="470" font-size="140" font-weight="500" fill="#9a7f63" filter="url(#halo)" opacity="0">스며드는</text>
        <text id="w3" x="640" y="470" font-size="140" font-weight="500" fill="#3a3330" filter="url(#bleed)" opacity="0">스며드는</text>
      </g>
    </svg>
  </div>
  <button data-replay="b">처음부터</button>
</main>

<script>
// 결정적 난수 (Math.random 대신)
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, s, d) => clamp((t - s) / d);
const powerOut = (t, p) => 1 - Math.pow(1 - t, p);           // tokens: glide 1.7, whip 2.52
const expoOut = (t, k) => (1 - Math.pow(2, -k * 3 * t)) / (1 - Math.pow(2, -k * 3)); // tokens: softLand 3.41
const smooth = t => t * t * (3 - 2 * t);

const start = { a: performance.now(), b: performance.now() };
document.querySelectorAll('[data-replay]').forEach(b => b.onclick = () => start[b.dataset.replay] = performance.now());

/* ---------- A: 김 서린 창 ---------- */
const A = document.getElementById('a'), ac = A.getContext('2d');
const W = A.width, H = A.height;
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };

// 창밖 풍경: 해 질 녘 하늘 + 먼 불빛 (채도 낮게)
const scene = mk(), sc = scene.getContext('2d');
{
  const g = sc.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1e2431'); g.addColorStop(0.45, '#3d3a48'); g.addColorStop(0.72, '#8a6552'); g.addColorStop(0.8, '#b58360'); g.addColorStop(1, '#2a2324');
  sc.fillStyle = g; sc.fillRect(0, 0, W, H);
  const r = rng(7);
  sc.fillStyle = '#211c1e';
  let x = 0; while (x < W) { const w = 40 + r() * 90, h = 30 + r() * 110; sc.fillRect(x, H * 0.8 - h, w, h + H * 0.2); x += w; }
  for (let i = 0; i < 70; i++) {
    const px = r() * W, py = H * (0.66 + r() * 0.26), rad = 3 + r() * 9;
    const lg = sc.createRadialGradient(px, py, 0, px, py, rad * 3);
    lg.addColorStop(0, `rgba(255,${190 + r() * 40 | 0},${120 + r() * 50 | 0},${0.5 + r() * 0.4})`); lg.addColorStop(1, 'rgba(255,200,140,0)');
    sc.fillStyle = lg; sc.beginPath(); sc.arc(px, py, rad * 3, 0, 7); sc.fill();
  }
  // 창틀 그림자 (왼쪽 아래 실내빛)
  const ig = sc.createRadialGradient(W * 0.1, H * 1.1, 0, W * 0.1, H * 1.1, W * 0.7);
  ig.addColorStop(0, 'rgba(255,190,130,0.22)'); ig.addColorStop(1, 'rgba(255,190,130,0)');
  sc.fillStyle = ig; sc.fillRect(0, 0, W, H);
}
// 김 서린 유리: 흐리게 + 뿌연 막 + 미세 물방울 입자
const fog = mk(), fc = fog.getContext('2d');
{
  fc.filter = 'blur(22px)'; fc.drawImage(scene, -30, -30, W + 60, H + 60); fc.filter = 'none';
  fc.fillStyle = 'rgba(206,200,194,0.42)'; fc.fillRect(0, 0, W, H);
  const r = rng(21);
  for (let i = 0; i < 9000; i++) {
    const px = r() * W, py = r() * H, s = r() * 1.6 + 0.3;
    fc.fillStyle = `rgba(255,255,255,${0.04 + r() * 0.1})`; fc.beginPath(); fc.arc(px, py, s, 0, 7); fc.fill();
  }
}
// 물방울 몇 개 (김 위에서 천천히 흐름)
const drops = (() => { const r = rng(5); return Array.from({ length: 7 }, () => ({ x: r() * W, y: r() * H * 0.6, s: 2.5 + r() * 3, v: 6 + r() * 14, d: r() * 3 })); })();

const mask = mk(), mc = mask.getContext('2d');
const clear = mk(), cc = clear.getContext('2d');
const txt = mk(), tc = txt.getContext('2d');
function drawText() {
  tc.clearRect(0, 0, W, H);
  tc.textAlign = 'center'; tc.fillStyle = '#f4ece0';
  tc.shadowColor = 'rgba(30,18,10,0.6)'; tc.shadowBlur = 24;
  tc.font = '500 38px Pretendard'; tc.fillText('서늘한 바람처럼', W / 2, H * 0.40);
  tc.font = '600 120px Pretendard'; tc.fillText('스며드는', W / 2, H * 0.57);
}
document.fonts.ready.then(drawText); drawText();

let lastA = -1, lastQ = 0;
function frameA(now) {
  let t = (now - start.a) / 1000;
  if (t > 9) { start.a = now; t = 0; }
  if (t < lastA || t < 0.05) { mc.clearRect(0, 0, W, H); lastQ = 0; }
  lastA = t;
  // 바람 한 줄: 1.0초~3.6초에 왼쪽에서 오른쪽으로. 프레임 사이를 촘촘히 메워 끊기지 않는 자국을 남긴다
  const p = prog(t, 1.0, 2.6);
  if (p > 0) {
    const e = powerOut(p, 1.7);
    for (let q = lastQ; q <= e; q += 0.003) {
      const x = -W * 0.1 + q * W * 1.2;
      const y = H * (0.49 + 0.025 * Math.sin(q * 5.2));
      const rad = H * (0.17 + 0.03 * Math.sin(q * 3.1 + 1));
      const g = mc.createRadialGradient(x, y, 0, x, y, rad);
      g.addColorStop(0, 'rgba(0,0,0,0.16)'); g.addColorStop(0.55, 'rgba(0,0,0,0.10)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      mc.save(); mc.translate(x, y); mc.scale(1.6, 1); mc.translate(-x, -y);
      mc.fillStyle = g; mc.beginPath(); mc.arc(x, y, rad, 0, 7); mc.fill(); mc.restore();
    }
    lastQ = e;
  }
  // 5.5초 뒤부터 김이 아주 천천히 다시 서림 (가장자리부터)
  if (t > 5.5) { mc.globalCompositeOperation = 'destination-out'; mc.fillStyle = 'rgba(0,0,0,0.006)'; mc.fillRect(0, 0, W, H); mc.globalCompositeOperation = 'source-over'; }

  ac.drawImage(fog, 0, 0);
  cc.globalCompositeOperation = 'source-over'; cc.clearRect(0, 0, W, H);
  cc.drawImage(scene, 0, 0); cc.drawImage(txt, 0, 0);
  cc.globalCompositeOperation = 'destination-in'; cc.drawImage(mask, 0, 0);
  ac.drawImage(clear, 0, 0);
  // 물방울
  for (const d of drops) {
    const y = d.y + Math.max(0, t - d.d) * d.v;
    ac.fillStyle = 'rgba(255,255,255,0.22)'; ac.beginPath(); ac.ellipse(d.x, y, d.s, d.s * 1.3, 0, 0, 7); ac.fill();
    ac.fillStyle = 'rgba(255,255,255,0.08)'; ac.fillRect(d.x - d.s * 0.4, y - Math.max(0, t - d.d) * d.v, d.s * 0.8, Math.max(0, t - d.d) * d.v);
  }
  // 아주 느린 카메라 숨 (한 샷 유지)
  A.style.transform = `scale(${1.0 + t * 0.003})`;
}

/* ---------- B: 종이 위 단어 ---------- */
const P = document.getElementById('paper'), pc = P.getContext('2d');
{
  pc.fillStyle = '#ece3d3'; pc.fillRect(0, 0, W, H);
  const r = rng(33);
  for (let i = 0; i < 26000; i++) { const v = r(); pc.fillStyle = `rgba(${v < 0.5 ? '90,70,50' : '255,250,240'},${0.025 + r() * 0.04})`; pc.fillRect(r() * W, r() * H, 1 + r() * 1.5, 1 + r() * 1.5); }
  pc.lineCap = 'round';
  for (let i = 0; i < 420; i++) { const x = r() * W, y = r() * H, a = r() * 6.3, l = 6 + r() * 26; pc.strokeStyle = `rgba(120,95,70,${0.04 + r() * 0.06})`; pc.lineWidth = 0.6; pc.beginPath(); pc.moveTo(x, y); pc.quadraticCurveTo(x + Math.cos(a) * l * 0.5 + 4, y + Math.sin(a) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l); pc.stroke(); }
  const v = pc.createRadialGradient(W / 2, H * 0.45, H * 0.2, W / 2, H / 2, W * 0.75);
  v.addColorStop(0, 'rgba(255,240,215,0.25)'); v.addColorStop(1, 'rgba(70,45,25,0.28)');
  pc.fillStyle = v; pc.fillRect(0, 0, W, H);
}
const $ = id => document.getElementById(id);
const w1 = $('w1'), w2 = $('w2'), w3 = $('w3'), w3h = $('w3h');
function frameB(now) {
  let t = (now - start.b) / 1000;
  if (t > 9.5) { start.b = now; t = 0; }
  // 0~2.4초: 물기 먹은 "눅눅한" — 아래로 처진다
  if (t < 2.4) {
    w1.textContent = '눅눅한'; w1.setAttribute('filter', 'url(#damp)'); w1.setAttribute('fill', '#6b5a49');
    w1.setAttribute('opacity', 0.55 + 0.25 * smooth(prog(t, 0, 0.8)));
    w1.setAttribute('transform', `translate(0 ${6 * smooth(prog(t, 0.2, 2.2))}) scale(1 1)`);
    w1.setAttribute('y', 300);
  } else {
    // 1프레임 교체: 마른 결의 "서늘한", 위로 살짝 정리되며 선다
    const q = expoOut(prog(t, 2.4, 0.4), 3.41);
    w1.textContent = '서늘한'; w1.setAttribute('filter', 'url(#crisp)'); w1.setAttribute('fill', '#3c4350');
    w1.setAttribute('opacity', 1);
    const lift = (1 - q) * 6 - 70 * expoOut(prog(t, 3.6, 0.6), 3.41);
    w1.setAttribute('transform', `translate(0 ${lift})`);
  }
  // 3.6~5.0초: "바람처럼"이 왼쪽에서 흘러와 "서늘한" 옆에 선다
  const s = prog(t, 3.6, 1.0);
  w2.setAttribute('opacity', s > 0 ? Math.min(1, s * 3) : 0);
  w2.setAttribute('x', 760 - 260 * (1 - powerOut(s, 2.52)));
  w2.setAttribute('y', 230);
  if (t >= 3.6) w1.setAttribute('x', 640 - 150 * expoOut(prog(t, 3.6, 0.6), 3.41)); else w1.setAttribute('x', 640);
  // 4.8~7.4초: "스며드는"이 종이에 배어든다 (번짐 → 섬유 따라 자리 잡음)
  const b = prog(t, 4.8, 2.6), be = expoOut(b, 3.41);
  w3.setAttribute('opacity', b > 0 ? 0.15 + 0.8 * smooth(clamp(b * 1.6)) : 0);
  $('bleedBlur').setAttribute('stdDeviation', 7 * (1 - be) + 0.55);
  $('bleedDisp').setAttribute('scale', 20 * (1 - be) + 3);
  $('bleedDil').setAttribute('radius', 0.7 * be);
  w3h.setAttribute('opacity', b > 0 ? 0.30 * smooth(clamp(b * 2)) : 0);
  $('haloDil').setAttribute('radius', 1 + 4 * be);
}

function loop(now) { frameA(now); frameB(now); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
